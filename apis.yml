aid: the-black-tux
name: The Black Tux
description: >-
  The Black Tux is an online formalwear company offering premium suit and tuxedo
  rentals and purchases for weddings and formal events. Founded in 2013 and
  headquartered in Santa Monica, California, it pairs a direct-to-consumer online
  store with roughly 50 physical showrooms nationwide, home try-on, group wedding
  coordination with party pricing, free shipping over $200, and a perfect-fit
  guarantee. The storefront runs on Shopify; The Black Tux does not publish a
  first-party developer API. The only machine-readable surface on the domain is
  Shopify's managed Customer Account identity service (OIDC / OAuth authorization
  server discovery). This profile was surfaced as a portfolio company of
  Menlo Ventures and enriched with the verifiable public identity and web
  properties the company genuinely publishes.
